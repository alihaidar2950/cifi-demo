name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        id: run-tests
        run: |
          pytest tests/ -v 2>&1 | tee /tmp/test-output.log
          exit ${PIPESTATUS[0]}

      - name: Analyze failure with CIFI
        if: failure()
        uses: alihaidar2950/cifi@9d67de02410e589d69ad3481d369cb1b15a7095d
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          log-file: /tmp/test-output.log
