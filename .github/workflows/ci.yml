name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      models: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        id: run-tests
        run: |
          pytest tests/ -v 2>&1 | tee $GITHUB_WORKSPACE/cifi-test.log
          exit ${PIPESTATUS[0]}

      - name: Analyze failure with CIFI
        id: cifi-analysis
        if: failure()
        uses: alihaidar2950/cifi@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          log-file: cifi-test.log

      - name: Show CIFI analysis outputs
        if: failure() && steps.cifi-analysis.outcome == 'success'
        run: |
          echo "=== CIFI Analysis Results ==="
          echo "Failure type : ${{ steps.cifi-analysis.outputs.failure-type }}"
          echo "Confidence   : ${{ steps.cifi-analysis.outputs.confidence }}"
          echo "Root cause   : ${{ steps.cifi-analysis.outputs.root-cause }}"

      - name: Verify CIFI comment posted
        if: failure() && github.event_name == 'pull_request' && steps.cifi-analysis.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ github.event.pull_request.number }}
          echo "Verifying CIFI comment on PR #$PR..."
          FOUND=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- cifi-analysis -->"))] | length')
          if [ "$FOUND" -eq 0 ]; then
            echo "❌ CIFI comment not posted on PR #$PR"
            exit 1
          fi
          echo "✅ CIFI comment verified (found $FOUND comment)"
